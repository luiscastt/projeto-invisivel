[project]
name = "invisivel-api"
version = "0.1.0"
description = "Inteligência territorial e participação cidadã"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20", "pillow>=11,<13", "psycopg[binary]>=3.2,<4", "shapely>=2.0,<3", "python-dotenv>=1,<2", "openpyxl>=3.1,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx2>=2,<3"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["apps/api/tests", "pipelines/tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
